# nginx site file for the validator demo on the EDEN entry VM. nginx there
# terminates TLS and proxies over eden-net to the harvester VM, which runs this
# service next to the harvester and has no public address.
#
# Install with:
#
#   sudo cp eden-validator.nginx.conf /etc/nginx/sites-available/validator
#   sudo ln -sf /etc/nginx/sites-available/validator /etc/nginx/sites-enabled/validator
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot --nginx then adds TLS to this server block and the 80 -> 443 redirect.

# Must equal UVICORN_HOST and UVICORN_PORT in /etc/eden-validator.env on the
# harvester VM.
upstream validator_backend {
    server 192.168.0.81:8002;
}

# A check is a few outbound requests to whatever URL the visitor typed. Rate-limit
# per client so one visitor cannot turn the validator into a request cannon. The
# zone lives in the entry VM's shared http context, hence the validator_ prefix.
limit_req_zone $binary_remote_addr zone=validator_validate:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eden-validator.vm.fedcloud.eu;

    access_log /var/log/nginx/validator.access.log;
    error_log  /var/log/nginx/validator.error.log;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An estimate, not measured: one check makes up to about four requests with a
    # 10s timeout each (probe, POST retry on 405, constructed probe URL).
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;

    # Every endpoint is GET; nothing legitimate sends a body.
    client_max_body_size 8k;

    # The limit sits on the two entry points that probe a URL. nginx matches the
    # path and ignores the query string, so GET /?url=... lands in "location = /".
    # Assets, /docs and /openapi.json go through "location /" unthrottled.
    location = / {
        limit_req zone=validator_validate burst=5 nodelay;
        proxy_pass http://validator_backend;
    }

    location = /validate {
        limit_req zone=validator_validate burst=5 nodelay;
        proxy_pass http://validator_backend;
    }

    location / {
        proxy_pass http://validator_backend;
    }

    location = /healthz {
        proxy_pass http://validator_backend;
        access_log off;
    }
}
